<ol class="jm-steps"><li data-i="0" class="jm-home"><button type="button"><span class="jm-date">9 Apr 1943</span><span class="jm-where">Rotterdam</span></button><p>Refuses to arrest Jews and goes into hiding, first at an address in Rotterdam. <a href="#april-1943-april-1944-in-hiding-oom-geert-in-the-achterhoek">More</a></p></li><li data-i="1" class="jm-hiding"><button type="button"><span class="jm-date">12 Apr 1943</span><span class="jm-where">Winterswijk</span></button><p>Hides with H. Wiggers at the farm Plak-an near Winterswijk. <a href="#april-1943-april-1944-in-hiding-oom-geert-in-the-achterhoek">More</a></p></li><li data-i="2" class="jm-hiding"><button type="button"><span class="jm-date">Late Apr 1943 – 20 Apr 1944</span><span class="jm-where">Satter farm, Sinderen</span></button><p>A year on Hendrik Satter's farm as “Oom Geert”, helping people in hiding and Allied airmen. He spends about five weeks of it with relatives in Friesland. <a href="#april-1943-april-1944-in-hiding-oom-geert-in-the-achterhoek">More</a></p></li><li data-i="3" class="jm-prison"><button type="button"><span class="jm-date">20–21 Apr 1944</span><span class="jm-where">Avegoor, Ellecom</span></button><p>Arrested at the farm. The truck takes the prisoners to Avegoor, where they are stripped: “Greydanus was in bad shape”. <a href="#april-august-1944-arrest-the-vught-bunker-transport">More</a></p></li><li data-i="4" class="jm-prison"><button type="button"><span class="jm-date">21 Apr 1944</span><span class="jm-where">Arnhem</span></button><p>Taken on to the SD (security police) building in Arnhem. <a href="#april-august-1944-arrest-the-vught-bunker-transport">More</a></p></li><li data-i="5" class="jm-prison"><button type="button"><span class="jm-date">21 Apr – 9 Aug 1944</span><span class="jm-where">Kamp Vught</span></button><p>Held in Kamp Vught and tortured in its bunker, cells 117 and 93. <a href="#april-august-1944-arrest-the-vught-bunker-transport">More</a></p></li><li data-i="6" class="jm-prison"><button type="button"><span class="jm-date">9 Aug 1944</span><span class="jm-where">Kleve</span></button><p>Sent by train with 15 others to the prison in Kleve, just over the German border. <a href="#april-august-1944-arrest-the-vught-bunker-transport">More</a></p></li><li data-i="7" class="jm-camp"><button type="button"><span class="jm-date">15 Aug 1944</span><span class="jm-where">Buchenwald</span></button><p>Registered at Buchenwald concentration camp and put in the overcrowded “Little Camp”. <a href="#august-1944-may-1945-buchenwald-niederorschel-and-liberation">More</a></p></li><li data-i="8" class="jm-camp"><button type="button"><span class="jm-date">4 Sep 1944 – 1 Apr 1945</span><span class="jm-where">Niederorschel</span></button><p>One of the 100 men who set up the Niederorschel subcamp, working 12-hour days for Langenwerke AG. <a href="#august-1944-may-1945-buchenwald-niederorschel-and-liberation">More</a></p></li><li data-i="9" class="jm-march"><button type="button"><span class="jm-date">1–11 Apr 1945</span><span class="jm-where">Buchenwald</span></button><p>Death march back to Buchenwald; more than 100 of the 525 who set out die. US troops liberate Buchenwald on 11 April. <a href="#the-death-march-niederorschel-to-buchenwald-april-1945">More</a></p></li><li data-i="10" class="jm-free"><button type="button"><span class="jm-date">8–9 May 1945</span><span class="jm-where">Eindhoven</span></button><p>Reaches the reception centre in Eindhoven and sends word to Johanna: “Am well and healthy.” <a href="#august-1944-may-1945-buchenwald-niederorschel-and-liberation">More</a></p></li><li data-i="11" class="jm-free"><button type="button"><span class="jm-date">12 May 1945</span><span class="jm-where">Rotterdam</span></button><p>Home in Rotterdam, “unrecognisable”. Back at work with the police two days later. <a href="#may-1945-september-1947-back-in-rotterdam">More</a></p></li><li data-i="12" class="jm-away"><button type="button"><span class="jm-date">8 Sep 1947</span><span class="jm-where">Rotterdam</span></button><p>Sails for Canada with his family on the Tabinta, and farms in Ontario for the rest of his life. <a href="#19471967-canada">More</a></p></li></ol>
<figcaption class="jm-note">Lines join the places in the order the records give; they are not the roads or railways he travelled. Positions are the towns, not exact addresses. Borders are today’s, from Natural Earth.</figcaption>
