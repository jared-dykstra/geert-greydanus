# Publishes the repository to GitHub Pages on every push to main, or by hand from
# the Actions tab (Publish site → Run workflow). Needs Settings → Pages → Source:
# "GitHub Actions". actions/deploy-pages waits at most 10 minutes for GitHub to
# finish a deploy; a longer timeout is ignored.
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
